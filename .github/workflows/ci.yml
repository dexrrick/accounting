name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Regression Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Check
        run: npm run lint

      - name: Production Build (TypeScript & Vite)
        env:
          APP_GIT_COMMIT: ${{ github.sha }}
          # Prefer a GitHub Actions repository variable. A secret also works for existing setups.
          VITE_FEEDBACK_ENDPOINT: ${{ vars.VITE_FEEDBACK_ENDPOINT || secrets.VITE_FEEDBACK_ENDPOINT }}
        run: npm run build

      - name: Execute Complete Regression Test Suite
        run: npm test
